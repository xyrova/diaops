# All tunable settings live here. DVC tracks each section as a stage dependency,
# so changing a value re-runs only the stages that use it.

prepare:
  test_size: 0.2
  seed: 42

train:
  model: xgboost        # xgboost | logreg (logreg is the baseline experiment)
  seed: 42
  n_jobs: 4             # pinned thread count for deterministic XGBoost results
  xgboost:
    n_estimators: 300
    max_depth: 5
    learning_rate: 0.03
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 10     # higher = fewer, larger leaves (less overfitting)
    reg_lambda: 5            # L2 penalty on leaf weights
    scale_pos_weight: auto   # auto = negatives / positives in the training set
  logreg:
    C: 1.0
    max_iter: 1000

evaluate:
  threshold: 0.5        # probability above which we flag "elevated risk"

# Used by scripts/check_gate.py in train.yml.
# Set from the batch_1 baselines: XGBoost recall 0.773 / AUC 0.825, LogReg recall 0.757.
gate:
  min_recall: 0.70      # hard floor: never ship a model that misses >30% of at-risk people
  max_auc_drop: 0.01    # max allowed ROC-AUC drop vs the latest released model
