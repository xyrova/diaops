stages:
  validate:
    cmd: python -m src.validate
    deps:
      - data/raw
      - src/validate.py
      - src/features.py
    outs:
      - reports/validation.json

  prepare:
    cmd: python -m src.prepare
    deps:
      - data/raw
      - reports/validation.json   # forces validate to run (and pass) first
      - src/prepare.py
      - src/features.py
    params:
      - prepare
    outs:
      - data/processed

  train:
    cmd: python -m src.train
    deps:
      - data/processed/train.csv
      - src/train.py
      - src/features.py
      - requirements.txt          # a library upgrade retrains the model
      - requirements-dev.txt      # (pandas / scikit-learn live here)
    params:
      - train
    outs:
      - models

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - data/processed/test.csv
      - models
      - src/evaluate.py
      - src/features.py
    params:
      - train.model
      - evaluate
    metrics:
      - metrics.json:
          cache: false              # small file, committed to Git for diffs and the gate
    plots:
      - plots/roc.csv
      - plots/pr.csv

plots:
  - plots/roc.csv:
      x: fpr
      y: tpr
      title: ROC curve
  - plots/pr.csv:
      x: recall
      y: precision
      title: Precision-Recall  curve
